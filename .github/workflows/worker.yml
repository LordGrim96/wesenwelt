# Veröffentlicht den Konto-Server (worker/) bei Cloudflare.
# Braucht zwei Geheimnisse im GitHub-Projekt: CLOUDFLARE_API_TOKEN und CLOUDFLARE_ACCOUNT_ID.
name: Server veröffentlichen
on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/worker.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: worker
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - name: Cloudflare eingerichtet?
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare-Geheimnisse fehlen noch – der Server wird übersprungen."
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != '1'
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
        if: steps.check.outputs.skip != '1'
      - name: Datenbank anlegen (nur beim ersten Mal) und eintragen
        if: steps.check.outputs.skip != '1'
        run: |
          find_id() { npx wrangler d1 list --json | node -e "const l=JSON.parse(require('fs').readFileSync(0,'utf8'));const d=l.find(x=>x.name==='wesenwelt');process.stdout.write(d?d.uuid:'')"; }
          ID="$(find_id)"
          if [ -z "$ID" ]; then npx wrangler d1 create wesenwelt --location weur; ID="$(find_id)"; fi
          test -n "$ID"
          sed -i "s/__D1_ID__/$ID/" wrangler.toml
      - name: Tabellen anlegen
        if: steps.check.outputs.skip != '1'
        run: npx wrangler d1 execute wesenwelt --remote --file schema.sql
      - name: Server hochladen
        if: steps.check.outputs.skip != '1'
        run: |
          npx wrangler deploy | tee deploy.log
          URL="$(grep -o 'https://[a-zA-Z0-9.-]*workers\.dev' deploy.log | head -1)"
          echo "Server-Adresse: $URL"
          echo "### Server ist online: $URL" >> "$GITHUB_STEP_SUMMARY"
